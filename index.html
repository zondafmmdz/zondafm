<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zonda FM - Sentí el Viento</title>
    
    <link rel="icon" type="image/png" href="./logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 10px; font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #252545 0%, #000000 100%);
            color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .logo-header { text-align: center; margin: 15px 0; }
        .logo-header img { 
            width: 180px; 
            height: auto; 
            filter: drop-shadow(0px 0px 20px rgba(255, 157, 0, 0.6)); 
        }

        .main-container { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 1200px; }
        .left-column { display: flex; flex-direction: column; gap: 20px; width: 100%; }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.04); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
        }

        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; background: #000; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* SECCIÓN AUDIO SIN TOCAR EL REPRODUCTOR */
        .audio-section { 
            padding: 20px 15px; text-align: center; 
            background: rgba(20, 20, 35, 0.9); border-top: 3px solid #FF7B00; 
        }
        .audio-section .live-badge { 
            background: #FF7B00; color: #000; font-weight: 800; font-size: 0.7rem; 
            padding: 4px 10px; border-radius: 5px; margin-bottom: 10px; display: inline-block;
        }

        .chat-section { width: 100%; height: 650px; background: #000; }
        .chat-section iframe { width: 100%; height: 100%; border: none; }

        /* FOOTER Y BOTONES */
        .info-footer { width: 100%; max-width: 1200px; margin: 30px 0; display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 768px) { .info-footer { grid-template-columns: 1fr 1fr; } }
        
        .glass-text { background: rgba(255, 255, 255, 0.03); padding: 20px; border-radius: 20px; border: 1px solid rgba(255, 157, 0, 0.2); text-align: center; }
        
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: white; padding: 14px; border-radius: 12px; font-weight: 700; margin-top: 10px; transition: 0.3s; }
        .btn-wsap { background: #1ebea5; }
        .btn-kick { background: #53fc18; color: #000; }
        .btn-tiktok { background: #000000; border: 1px solid #ff0050; box-shadow: 2px 2px 0px #00f2ea, -2px -2px 0px #ff0050; }

        @media (min-width: 900px) {
            .main-container { flex-direction: row; height: 85vh; }
            .left-column { flex: 2; overflow-y: auto; }
            .chat-section { flex: 0.8; height: auto; }
        }
    </style>
</head>
<body>

    <header class="logo-header">
        <img src="./logo.png" alt="Zonda FM Logo">
    </header>

    <main class="main-container">
        <div class="left-column">
            <section class="glass-panel video-wrapper">
                <iframe src="https://player.kick.com/zondafm?autoplay=true&muted=false&parent=zondafmmdz.netlify.app" allowfullscreen="true"></iframe>
            </section>

            <section class="glass-panel audio-section">
                <span class="live-badge">REPRODUCTOR 24/7 (AUDIO SOLO)</span>
                <div data-type="newStreamPlayer" data-publicToken="f9596676-a89f-4cdd-9d4f-450f1713cd56" data-theme="dark" data-color="FF7B00" data-channelId="a0a1e836-5c29-4d57-8ea8-8fe24f90292d" data-rendered="false" class="cstrEmbed">
                    <a href="https://www.caster.fm">Shoutcast Hosting</a> 
                    <a href="https://www.caster.fm">Stream Hosting</a> 
                    <a href="https://www.caster.fm">Radio Server Hosting</a>
                </div>
            </section>
        </div>

        <section class="glass-panel chat-section">
            <iframe 
                src="https://kick.com/popout/zondafm/chat" 
                scrolling="no"
                allow="clipboard-write">
            </iframe>
        </section>
    </main>

    <footer class="info-footer">
        <div class="glass-text">
            <p>🎵 Pedí tu tema favorito:</p>
            <a href="https://wa.me/2616816574" class="btn btn-wsap" target="_blank">💬 WhatsApp</a>
        </div>

        <div class="glass-text">
            <p>🔥 Seguinos en nuestras redes:</p>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <a href="https://kick.com/zondafm" class="btn btn-kick" target="_blank">💚 Seguir en KICK</a>
                <a href="https://www.tiktok.com/@zonda.fm" class="btn btn-tiktok" target="_blank">📱 Seguir en TIKTOK</a>
            </div>
        </div>
    </footer>

    <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>

</body>
</html>
