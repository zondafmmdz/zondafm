<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zonda FM - Sentí el Viento</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#252545">
    <link rel="apple-touch-icon" href="./logo.png">

    <link rel="icon" type="image/png" href="./logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 10px; font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #252545 0%, #000000 100%);
            color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .logo-header { text-align: center; margin: 10px 0; }
        .logo-header img { width: 140px; height: auto; filter: drop-shadow(0px 0px 15px rgba(255, 123, 0, 0.5)); }

        .main-container { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 1200px; }
        .left-column { display: flex; flex-direction: column; gap: 15px; width: 100%; }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.04); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; overflow: hidden; 
        }

        /* REPRODUCTOR - Corrección de centrado y HUD */
        .video-wrapper { position: relative; width: 100%; background: #000; aspect-ratio: 16/9; }
        .video-js { width: 100% !important; height: 100% !important; }
        
        /* Forzar centrado del botón Play circular */
        .vjs-big-play-button {
            top: 50% !important; left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 70px !important; height: 70px !important;
            line-height: 70px !important; border-radius: 50% !important;
            background-color: rgba(255, 123, 0, 0.8) !important;
            border: none !important;
        }

        .controls-section { padding: 15px; text-align: center; background: rgba(20, 20, 35, 0.8); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-sm { display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: 12px; text-decoration: none; color: white; font-size: 0.85rem; font-weight: 700; transition: 0.2s; }
        .btn-wsap { background: #1ebea5; }
        .btn-tiktok { background: #000; border: 1px solid #ff0050; }

        /* CHAT - Ajuste para no dejar blanco abajo */
        .chat-section { width: 100%; height: 400px; display: flex; flex-direction: column; background: #fff; }
        .chat-header { background: #FF7B00; color: #000; padding: 8px; font-weight: 800; font-size: 0.75rem; text-align: center; }
        .chat-container { flex: 1; position: relative; width: 100%; height: 100%; }
        .chat-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        @media (min-width: 900px) {
            .main-container { flex-direction: row; align-items: stretch; }
            .left-column { flex: 1.5; }
            .chat-section { flex: 1; height: auto; min-height: 550px; }
        }
    </style>
</head>
<body>

    <header class="logo-header">
        <img src="./logo.png" alt="Zonda FM Logo">
    </header>

    <main class="main-container">
        <div class="left-column">
            <section class="glass-panel">
                <div class="video-wrapper">
                    <video id="live-stream" class="video-js vjs-default-skin vjs-big-play-centered" 
                           controls preload="auto" poster="./logo.png" 
                           playsinline webkit-playsinline>
                        <source src="/hls/mistream.m3u8" type="application/x-mpegURL">
                    </video>
                </div>
                <div class="controls-section">
                    <div class="btn-grid">
                        <a href="https://wa.me/2616816574" class="btn-sm btn-wsap" target="_blank">WhatsApp</a>
                        <a href="https://www.tiktok.com/@zonda.fm" class="btn-sm btn-tiktok" target="_blank">TikTok</a>
                    </div>
                </div>
            </section>
        </div>

        <section class="glass-panel chat-section">
            <div class="chat-header">🗨️ COMUNIDAD ZONDA</div>
            <div class="chat-container">
                <iframe src="https://www3.cbox.ws/box/?boxid=3551487&boxtag=NAVD0a" allowtransparency="yes" allow="autoplay" frameborder="0" marginwidth="0" scrolling="auto"></iframe>
            </div>
        </section>
    </main>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        // Registrar Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        const player = videojs('live-stream');

        // MEDIA SESSION API: Esto es CLAVE para el bloqueo de pantalla
        if ('mediaSession' in navigator) {
            player.on('play', () => {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Zonda FM - En Vivo',
                    artist: 'Mendoza, Argentina',
                    album: 'Sentí el Viento',
                    artwork: [{ src: './logo.png', sizes: '512x512', type: 'image/png' }]
                });
                navigator.mediaSession.playbackState = 'playing';
            });
            
            player.on('pause', () => {
                navigator.mediaSession.playbackState = 'paused';
            });

            navigator.mediaSession.setActionHandler('play', () => player.play());
            navigator.mediaSession.setActionHandler('pause', () => player.pause());
        }

        // TRUCO FINAL PARA EL BLOQUEO: WakeLock
        // Intenta mantener la reproducción activa
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('keepAwake' in screen || 'wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        player.on('play', requestWakeLock);
    </script>
</body>
</html>
