<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonda FM - En Vivo</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1a1a1a; color: white; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        
        /* Estilo para que el iframe sea responsivo */
        .video-responsive {
            position: relative;
            padding-bottom: 56.25%; /* Relación de aspecto 16:9 */
            height: 0;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .video-responsive iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            width: 100%;
            border: 0;
        }

        .audio-player {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Zonda FM en Vivo</h1>

        <div class="video-responsive">
            <iframe src="https://zondafm.duckdns.org/hls/mistream.m3u8" scrolling="no" allowfullscreen></iframe>
        </div>

        <div class="audio-player">
            <h3>Escuchar Solo Audio (Pantalla bloqueada)</h3>
            <audio id="radioAudio" controls>
                <source src="https://zondafm.duckdns.org/hls/mistream.m3u8" type="application/x-mpegURL">
                Tu navegador no soporta streaming de audio.
            </audio>
            <p><small>Dale Play aquí para que no se corte al bloquear el celu.</small></p>
        </div>
    </div>

    <script>
        // Este bloque ayuda a que el celular identifique el nombre de la radio en la pantalla de bloqueo
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'Zonda FM',
                artist: 'En Vivo',
                album: 'Streaming Directo'
            });
        }
    </script>
</body>
</html>
