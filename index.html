<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonda FM - En Vivo</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0b0b0d; color: #efeff1; height: 100vh; overflow: hidden; }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            height: 100vh;
        }

        /* ÁREA DEL STREAM */
        .video-section {
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #1a1a1c 0%, #000 100%);
            padding: 10px;
        }

        .header-bar {
            height: 70px;
            background: rgba(24, 24, 27, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 10px;
        }

        .header-bar img {
            height: 50px;
            width: 50px;
            margin-right: 15px;
            border: 2px solid #9147ff; /* Morado estilo Twitch */
            border-radius: 50%;
            padding: 2px;
            background: #000;
        }

        .video-container {
            flex-grow: 1;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            background: #000;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* ÁREA DEL CHAT */
        .chat-sidebar {
            background: #18181b;
            border-left: 1px solid #2d2d30;
            display: flex;
            flex-direction: column;
        }

        .chat-title {
            padding: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid #2d2d30;
            color: #adadb8;
        }

        /* TRUCO AUDIO INVISIBLE */
        #bg-audio-player {
            position: absolute;
            visibility: hidden;
            width: 0; height: 0;
        }

        /* LIVE BADGE */
        .live-badge {
            background: #eb0400;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            margin-left: 10px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @media (max-width: 1000px) {
            .main-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; }
            .chat-sidebar { height: 500px; }
            body { overflow-y: auto; }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <section class="video-section">
            <header class="header-bar">
                <img src="logo.png" alt="Zonda Logo">
                <div style="flex-grow: 1;">
                    <div style="display: flex; align-items: center;">
                        <h1 style="font-size: 1.1rem; font-weight: 700;">ZONDA FM</h1>
                        <span class="live-badge">En Vivo</span>
                    </div>
                    <p style="font-size: 0.8rem; color: #adadb8;">Streaming HD desde San Juan</p>
                </div>
            </header>

            <div class="video-container">
                <iframe src="https://zondafm.duckdns.org/hls/mistream.m3u8" allowfullscreen></iframe>
                
                <audio id="bg-audio-player" autoplay controls loop>
                    <source src="https://zondafm.duckdns.org/hls/mistream.m3u8" type="application/x-mpegURL">
                </audio>
            </div>
        </section>

        <section class="chat-sidebar">
            <div class="chat-title">Chat de la Comunidad</div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center;">
                <div style="background: #1f1f23; padding: 20px; border-radius: 12px; border: 1px dashed #3a3a3d;">
                    <p style="color: #bf94ff; font-weight: 600; margin-bottom: 5px;">¡Próximamente!</p>
                    <p style="font-size: 0.85rem; color: #adadb8;">Estamos configurando el chat para la comunidad de Zonda FM.</p>
                </div>
            </div>
        </section>
    </div>

</body>
</html>
