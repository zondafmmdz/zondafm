<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonda FM - En Vivo</title>
    
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0e0e10; color: #efeff1; height: 100vh; overflow: hidden; }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            height: 100vh;
        }

        /* ÁREA IZQUIERDA: VIDEO Y LOGO */
        .video-section {
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Barra Superior del Stream */
        .stream-header {
            height: 60px;
            background: #18181b;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #2d2d30;
        }

        .stream-header img {
            height: 40px;
            margin-right: 15px;
        }

        .video-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* ÁREA DERECHA: CHAT */
        .chat-section {
            background: #18181b;
            border-left: 1px solid #2d2d30;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #2d2d30;
            background: #1f1f23;
        }

        /* REPRODUCTOR DE AUDIO INVISIBLE (Para el truco del celu) */
        #audio-hidden {
            position: absolute;
            bottom: 10px;
            left: 10px;
            opacity: 0.2; /* Casi invisible, podés poner 0 si no querés verlo nunca */
            width: 200px;
            height: 30px;
            z-index: 10;
        }

        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; }
            .chat-section { height: 400px; }
            body { overflow-y: auto; }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <section class="video-section">
            <div class="stream-header">
                <img src="logo.png" alt="Zonda FM">
                <div>
                    <h2 style="font-size: 1.1rem;">ZONDA FM - EN VIVO</h2>
                    <p style="font-size: 0.7rem; color: #adadb8;">Streaming Oficial</p>
                </div>
            </div>

            <div class="video-container">
                <iframe src="https://zondafm.duckdns.org/hls/mistream.m3u8" allowfullscreen></iframe>
            </div>
            
            <audio id="audio-hidden" controls>
                <source src="https://zondafm.duckdns.org/hls/mistream.m3u8" type="application/x-mpegURL">
            </audio>
        </section>

        <section class="chat-section">
            <div class="chat-header">CHAT DE LA COMUNIDAD</div>
            <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; color: #555;">
                <p>Chat próximamente...</p>
            </div>
        </section>

    </div>

</body>
</html>
