<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zonda FM - Sentí el Viento</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#252545">
    <link rel="apple-touch-icon" href="./logo.png">

    <link rel="icon" type="image/png" href="./logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/city/index.css" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 10px; font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #252545 0%, #000000 100%);
            color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .logo-header { text-align: center; margin: 10px 0; }
        .logo-header img { width: 160px; height: auto; filter: drop-shadow(0px 0px 15px rgba(255, 123, 0, 0.5)); }

        .main-container { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 1200px; }
        .left-column { display: flex; flex-direction: column; gap: 15px; width: 100%; }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.04); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        .video-wrapper { position: relative; width: 100%; background: #000; }
        .vjs-theme-city { width: 100% !important; height: auto !important; aspect-ratio: 16/9; }
        .vjs-theme-city .vjs-big-play-button { background-color: #FF7B00 !important; border-radius: 50% !important; width: 80px !important; height: 80px !important; line-height: 80px !important; margin-top: -40px !important; margin-left: -40px !important; }
        .vjs-theme-city .vjs-play-progress { background-color: #FF7B00 !important; }

        .controls-section { padding: 20px; text-align: center; background: rgba(20, 20, 35, 0.8); }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn-sm { display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; color: white; padding: 15px; border-radius: 15px; font-size: 0.9rem; font-weight: 700; transition: 0.2s; }
        .btn-sm:active { transform: scale(0.95); }
        .btn-wsap { background: #1ebea5; box-shadow: 0 4px 15px rgba(30, 190, 165, 0.3); }
        .btn-tiktok { background: #000; border: 1px solid #ff0050; box-shadow: 0 4px 15px rgba(255, 0, 80, 0.2); }

        .chat-section { width: 100%; min-height: 500px; background: #fff; display: flex; flex-direction: column; }
        .chat-header { background: #FF7B00; color: #000; padding: 10px; font-weight: 800; font-size: 0.8rem; text-align: center; }
        .chat-container { flex: 1; width: 100%; position: relative; }
        .chat-container iframe { width: 100%; height: 100%; border: none; }

        @media (min-width: 900px) {
            .main-container { flex-direction: row; align-items: stretch; }
            .left-column { flex: 1.8; }
            .chat-section { flex: 1; height: auto; }
        }
    </style>
</head>
<body>

    <header class="logo-header">
        <img src="./logo.png" alt="Zonda FM Logo">
    </header>

    <main class="main-container">
        <div class="left-column">
            <section class="glass-panel">
                <div class="video-wrapper">
                    <video id="live-stream" class="video-js vjs-theme-city" 
                           controls preload="auto" poster="./logo.png" 
                           playsinline webkit-playsinline
                           data-setup='{"fluid": true}'>
                        <source src="/hls/mistream.m3u8" type="application/x-mpegURL">
                    </video>
                </div>

                <div class="controls-section">
                    <div class="btn-grid">
                        <a href="https://wa.me/2616816574" class="btn-sm btn-wsap" target="_blank">WhatsApp</a>
                        <a href="https://www.tiktok.com/@zonda.fm" class="btn-sm btn-tiktok" target="_blank">TikTok</a>
                    </div>
                </div>
            </section>
        </div>

        <section class="glass-panel chat-section">
            <div class="chat-header">🗨️ COMUNIDAD ZONDA</div>
            <div class="chat-container">
                <iframe src="https://www3.cbox.ws/box/?boxid=3551487&boxtag=NAVD0a" allowtransparency="yes" allow="autoplay" frameborder="0" marginwidth="0" scrolling="auto"></iframe>
            </div>
        </section>
    </main>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        // Registro de Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        // CONTROL DE BACKGROUND AUDIO (MediaSession API)
        const video = document.getElementById('live-stream_html5_api'); 
        // Nota: Video.js le pone ese ID al elemento nativo
        
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'Zonda FM - En Vivo',
                artist: 'Mendoza, Argentina',
                album: 'Sentí el Viento',
                artwork: [
                    { src: './logo.png', sizes: '512x512', type: 'image/png' }
                ]
            });

            navigator.mediaSession.setActionHandler('play', () => { document.querySelector('video').play(); });
            navigator.mediaSession.setActionHandler('pause', () => { document.querySelector('video').pause(); });
        }

        // Truco para evitar la pausa al minimizar en algunos Android
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                // Si el sistema intenta pausar, forzamos play (con un leve delay)
                setTimeout(() => {
                    const v = document.querySelector('video');
                    if (v.paused && !v.ended) v.play();
                }, 100);
            }
        });
    </script>
</body>
</html>
