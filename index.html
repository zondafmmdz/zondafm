<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zonda FM - Sentí el Viento</title>
    
    <meta property="og:title" content="Zonda FM - Sentí el Viento">
    <meta property="og:description" content="Escuchanos en vivo desde Mendoza. La radio que te acompaña con la mejor música las 24hs.">
    <meta property="og:image" content="https://zondafmmdz.netlify.app/logo.png">
    <meta property="og:url" content="https://zondafmmdz.netlify.app">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" href="./logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 10px; font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #252545 0%, #000000 100%);
            color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .logo-header { text-align: center; margin: 15px 0; }
        .logo-header img { width: 180px; height: auto; filter: drop-shadow(0px 0px 20px rgba(255, 157, 0, 0.6)); }

        .main-container { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 1200px; }
        .left-column { display: flex; flex-direction: column; gap: 20px; width: 100%; }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.04); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
        }

        /* Video responsivo sin height fijo */
        .video-wrapper { position: relative; padding-bottom: 56.25%; width: 100%; background: #000; }
        .video-wrapper .video-js { position: absolute; top: 0; left: 0; width: 100% !important; height: 100% !important; border: none; }

        .audio-section { padding: 25px 15px; text-align: center; background: #141423; border-top: 3px solid #FF7B00; }
        .live-badge { background: #FF7B00; color: #000; font-weight: 800; font-size: 0.7rem; padding: 4px 10px; border-radius: 5px; margin-bottom: 20px; display: inline-block; }

        /* Chat responsivo */
        .chat-section { 
            width: 100%; 
            min-height: 500px;
            background: #fff; 
            display: flex; 
            flex-direction: column; 
        }
        .chat-header { background: #FF7B00; color: #000; padding: 10px; font-weight: 800; font-size: 0.8rem; text-align: center; text-transform: uppercase; }
        .chat-container { flex: 1; width: 100%; position: relative; }
        .chat-container iframe { width: 100%; height: 100%; border: none; display: block; position: absolute; top:0; left:0; }

        .info-footer { width: 100%; max-width: 1200px; margin: 30px 0; display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 768px) { .info-footer { grid-template-columns: 1fr 1fr; } }
        
        .glass-text { background: rgba(255, 255, 255, 0.03); padding: 20px; border-radius: 20px; border: 1px solid rgba(255, 157, 0, 0.2); text-align: center; }
        
        .btn { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; color: white; padding: 14px; border-radius: 12px; font-weight: 700; margin-top: 10px; }
        .btn-wsap { background: #1ebea5; }
        .btn-kick { background: #53fc18; color: #000; }
        .btn-tiktok { background: #000000; border: 1px solid #ff0050; }

        .share-fab { position: fixed; bottom: 20px; right: 20px; background-color: #25D366; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 9999; }

        @media (min-width: 900px) {
            .main-container { flex-direction: row; align-items: stretch; }
            .left-column { flex: 1.8; }
            .chat-section { flex: 1; height: auto; }
        }
    </style>
</head>
<body>

    <header class="logo-header">
        <img src="./logo.png" alt="Zonda FM Logo">
    </header>

    <main class="main-container">
        <div class="left-column">
            <section class="glass-panel">
                <div class="video-wrapper">
                    <video id="live-stream" class="video-js vjs-default-skin" controls preload="auto">
                        <source src="https://zondafm.loca.lt/hls/stream.m3u8" type="application/x-mpegURL">
                        <p class="vjs-no-js">Para ver este video, habilite JavaScript o use un navegador compatible con HTML5.</p>
                    </video>
                </div>
            </section>

            <section class="glass-panel audio-section">
                <span class="live-badge">RADIO EN VIVO 24/7</span>
                <div data-type="newStreamPlayer" data-publicToken="f9596676-a89f-4cdd-9d4f-450f1713cd56" data-theme="dark" data-color="FF7B00" class="cstrEmbed">
                    <a href="https://www.caster.fm">Radio Server Hosting</a>
                </div>
                <script src="//cdn.cloud.caster.fm//widgets/embed.js"></script>
            </section>
        </div>

        <section class="glass-panel chat-section">
            <div class="chat-header">🗨️ Chat de la Comunidad</div>
            <div class="chat-container">
                <iframe src="https://www3.cbox.ws/box/?boxid=3551487&boxtag=NAVD0a" allowtransparency="yes" allow="autoplay" frameborder="0" marginwidth="0" scrolling="auto"></iframe>
            </div>
        </section>
    </main>

    <footer class="info-footer">
        <div class="glass-text">
            <p>🎵 Pedí tu tema favorito:</p>
            <a href="https://wa.me/2616816574" class="btn btn-wsap" target="_blank">💬 WhatsApp</a>
        </div>
        <div class="glass-text">
            <p>🔥 Seguinos en nuestras redes:</p>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <a href="https://kick.com/zondafm" class="btn btn-kick" target="_blank">💚 KICK</a>
                <a href="https://www.tiktok.com/@zonda.fm" class="btn btn-tiktok" target="_blank">📱 TIKTOK</a>
            </div>
        </div>
    </footer>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
</body>
</html>
