<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zonda FM - Sentí el Viento</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#252545">
    
    <link rel="icon" type="image/png" href="./logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 10px; font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top, #252545 0%, #000000 100%);
            color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        .logo-header { text-align: center; margin: 15px 0; }
        .logo-header img { width: 150px; height: auto; filter: drop-shadow(0px 0px 20px rgba(255, 123, 0, 0.6)); }

        .main-container { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 1100px; }

        .glass-panel { 
            background: rgba(255, 255, 255, 0.04); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 28px; overflow: hidden; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
        }

        .video-wrapper { position: relative; width: 100%; background: #000; aspect-ratio: 16/9; }
        .video-js { width: 100% !important; height: 100% !important; }
        
        /* Botón Play Naranja Gigante Centrado */
        .vjs-big-play-button {
            top: 50% !important; left: 50% !important;
            transform: translate(-50%, -50%) !important;
            width: 90px !important; height: 90px !important;
            line-height: 90px !important; border-radius: 50% !important;
            background-color: #FF7B00 !important;
            border: none !important; box-shadow: 0 0 30px rgba(255, 123, 0, 0.5) !important;
            font-size: 3.5em !important;
        }

        .vjs-play-progress, .vjs-volume-level { background-color: #FF7B00 !important; }

        .controls-section { padding: 20px; background: rgba(20, 20, 35, 0.6); }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-sm { display: flex; align-items: center; justify-content: center; padding: 16px; border-radius: 15px; text-decoration: none; color: white; font-weight: 700; font-size: 0.9rem; transition: 0.3s; }
        .btn-wsap { background: #1ebea5; box-shadow: 0 5px 15px rgba(30, 190, 165, 0.3); }
        .btn-tiktok { background: #000; border: 1px solid #ff0050; }

        .chat-section { width: 100%; height: 450px; background: #fff; display: flex; flex-direction: column; border-radius: 28px; }
        .chat-header { background: #FF7B00; color: #000; padding: 12px; font-weight: 800; text-align: center; font-size: 0.8rem; }
        .chat-container { flex: 1; position: relative; }
        .chat-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        @media (min-width: 900px) {
            .main-container { flex-direction: row; align-items: stretch; }
            .left-column { flex: 1.6; }
            .chat-section { flex: 1; height: auto; min-height: 500px; }
        }
    </style>
</head>
<body>

    <header class="logo-header">
        <img src="./logo.png" alt="Zonda FM Logo">
    </header>

    <main class="main-container">
        <div class="left-column">
            <section class="glass-panel">
                <div class="video-wrapper">
                    <video id="live-stream" class="video-js vjs-default-skin" 
                           controls preload="auto" poster="./logo.png" 
                           playsinline webkit-playsinline>
                        <source src="/hls/mistream.m3u8" type="application/x-mpegURL">
                    </video>
                </div>
                <div class="controls-section">
                    <div class="btn-grid">
                        <a href="https://wa.me/2616816574" class="btn-sm btn-wsap" target="_blank">WhatsApp</a>
                        <a href="https://www.tiktok.com/@zonda.fm" class="btn-sm btn-tiktok" target="_blank">TikTok</a>
                    </div>
                </div>
            </section>
        </div>

        <section class="chat-section glass-panel">
            <div class="chat-header">🗨️ COMUNIDAD ZONDA</div>
            <div class="chat-container">
                <iframe src="https://www3.cbox.ws/box/?boxid=3551487&boxtag=NAVD0a" allowtransparency="yes" allow="autoplay" frameborder="0" marginwidth="0" scrolling="auto"></iframe>
            </div>
        </section>
    </main>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        const player = videojs('live-stream');

        // 1. MediaSession para controles en bloqueo y notificaciones
        if ('mediaSession' in navigator) {
            player.on('play', () => {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Zonda FM - En Vivo',
                    artist: 'Mendoza, Argentina',
                    artwork: [{ src: './logo.png', sizes: '512x512', type: 'image/png' }]
                });
                navigator.mediaSession.playbackState = 'playing';
            });
            player.on('pause', () => {
                navigator.mediaSession.playbackState = 'paused';
            });
        }

        // 2. DOBLE VERIFICACIÓN: Anti-Sleep Loop
        let antiSleepInterval;

        player.on('play', () => {
            if (!antiSleepInterval) {
                antiSleepInterval = setInterval(() => {
                    if (player.paused() && !player.ended()) {
                        player.play().catch(() => {});
                    }
                }, 1000);
            }
        });

        player.on('pause', () => {
            clearInterval(antiSleepInterval);
            antiSleepInterval = null;
        });

        // Forzar play al cambiar visibilidad
        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === 'hidden' && !player.paused()) {
                player.play();
            }
        });
    </script>
</body>
</html>
