<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonda FM - Modo Stream</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #0e0e10; color: #efeff1; height: 100vh; overflow: hidden; }

        /* Contenedor Principal: Grid de 2 columnas */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px; /* Video flexible, Chat fijo de 340px */
            height: 100vh;
        }

        /* Área del Video */
        .video-section {
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* Área del Chat */
        .chat-section {
            background: #18181b;
            border-left: 1px solid #2d2d30;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-bottom: 1px solid #2d2d30;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        .chat-placeholder {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-style: italic;
        }

        /* Reproductor de audio escondido pero funcional para el fondo */
        .audio-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        audio { height: 30px; width: 300px; opacity: 0.7; }

        /* Adaptación para Celulares */
        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                overflow-y: auto;
            }
            body { overflow-y: auto; }
            .chat-section { height: 400px; }
            .video-section { height: auto; }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <section class="video-section">
            <div class="video-container">
                <iframe src="https://zondafm.duckdns.org/hls/mistream.m3u8" allowfullscreen></iframe>
            </div>
            
            <div class="audio-bar">
                <p style="font-size: 12px; margin-right: 10px;">Audio de fondo:</p>
                <audio controls>
                    <source src="https://zondafm.duckdns.org/hls/mistream.m3u8" type="application/x-mpegURL">
                </audio>
            </div>
        </section>

        <section class="chat-section">
            <div class="chat-header">Chat de la Transmisión</div>
            <div class="chat-placeholder">
                <p>Aquí va el chat...</p>
            </div>
        </section>

    </div>

    <script>
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
                title: 'Zonda FM',
                artist: 'Modo Teatro'
            });
        }
    </script>
</body>
</html>
