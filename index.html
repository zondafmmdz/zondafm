<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zonda FM - En Vivo</title>
    
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0e0e10; color: #efeff1; height: 100vh; overflow: hidden; }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            height: 100vh;
        }

        /* ÁREA DEL STREAM */
        .video-section {
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .header-bar {
            height: 64px;
            background: #18181b;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #2d2d30;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .header-bar img {
            height: 45px;
            width: 45px;
            margin-right: 15px;
            border: 2px solid #bf94ff;
            border-radius: 50%;
            object-fit: cover;
        }

        .video-container {
            flex-grow: 1;
            position: relative;
            background: #000;
        }

        iframe { width: 100%; height: 100%; border: none; }

        /* ÁREA DEL CHAT */
        .chat-sidebar {
            background: #18181b;
            border-left: 1px solid #2d2d30;
            display: flex;
            flex-direction: column;
        }

        .chat-title {
            padding: 15px;
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 700;
            text-align: center;
            background: #1f1f23;
            border-bottom: 1px solid #2d2d30;
            color: #adadb8;
        }

        /* REPRODUCTOR OCULTO (ELIMINADO VISUALMENTE) */
        #bg-audio-player {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0; /* Totalmente invisible */
            pointer-events: none;
        }

        /* Responsivo para móviles */
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; }
            .chat-sidebar { height: 400px; border-left: none; border-top: 1px solid #2d2d30; }
            body { overflow-y: auto; }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <section class="video-section">
            <header class="header-bar">
                <img src="logo.png" alt="Zonda Logo">
                <div>
                    <h1 style="font-size: 1rem; color: #efeff1; font-weight: 600;">ZONDA FM - EN VIVO</h1>
                    <div style="display: flex; align-items: center;">
                        <span style="height: 8px; width: 8px; background: #eb0400; border-radius: 50%; margin-right: 6px;"></span>
                        <p style="font-size: 0.75rem; color: #adadb8; font-weight: 400;">Transmisión Oficial</p>
                    </div>
                </div>
            </header>

            <div class="video-container">
                <iframe src="https://zondafm.duckdns.org/hls/mistream.m3u8" allowfullscreen></iframe>
                
                <audio id="bg-audio-player" autoplay controls>
                    <source src="https://zondafm.duckdns.org/hls/mistream.m3u8" type="application/x-mpegURL">
                </audio>
            </div>
        </section>

        <section class="chat-sidebar">
            <div class="chat-title">CHAT DE LA COMUNIDAD</div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #555; padding: 20px;">
                <p style="font-size: 0.9rem; margin-bottom: 10px;">¡Bienvenido al chat!</p>
                <p style="font-size: 0.8rem; text-align: center;">El chat se activará pronto para todos los oyentes.</p>
            </div>
        </section>
    </div>

</body>
</html>
